[project]
name = "discord-twitch-bot"
description = "A Discord bot that sends notifications when Twitch streamers go live."
requires-python = ">=3.12"
authors = [{ name = "Phoenix591" }]
dynamic = ["version"]
dependencies = [
    "discord.py>=2.0.0",
    "twitchio>=3.0.0",
    "aiohttp>=3.7.4",
    # 4.x removes AsyncIOScheduler and add_job. It is still a pre-release.
    "apscheduler>=3.11.2,<4",
    "boto3>=1.42.39"
]
license = "MIT"
license-files = ["LICENSE"]
[project.scripts]
discord-twitch = "discord_twitch.bot:main"
manage_streamer = "discord_twitch.manage_streamer:main"

[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Ansible installs from a source copy that may not include .git.
fallback_version = "0.0.0"
