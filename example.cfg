[discord]
# The token for your Discord bot (from the Developer Portal)
token = YOUR_DISCORD_BOT_TOKEN_HERE

# The ID of the Discord channel where alerts will be posted
# Right-click a channel in Discord -> Copy Channel ID (Developer Mode required)
channelid = 123456789012345678

[server]
# The domain name your SSL certificate covers
domain = twitch.example.com

# The full public URL Twitch & YouTube should POST data to
# This must match the proxy_pass path in your Nginx config
public_url = https://twitch.example.com/callback

# The internal port the Python script listens on (Nginx forwards to this)
port = 8080

# A random string used to verify authorized takeover requests from Ansible
# Generate one using terminal: openssl rand -hex 32
internal_api_secret = YOUR_RANDOM_INTERNAL_SECRET_HERE

# The DynamoDB table name used to store active streams and schedules
# (Defaults to "discord-twitch-state" if omitted)
dynamodb_table = discord-twitch-state

# AWS region for the state table and the streamers table.
# (Defaults to "us-east-1" if omitted)
dynamodb_region = us-east-1

# Optional. Table that holds the streamers to announce.
# (Defaults to "discord-twitch-streamers" if omitted)
# dynamodb_streamers_table = discord-twitch-streamers

[twitch]
# Your Twitch Application credentials (from https://dev.twitch.tv/console)
clientid = YOUR_TWITCH_CLIENT_ID_HERE
clientsecret = YOUR_TWITCH_CLIENT_SECRET_HERE

# Optional. Stable EventSub secret so a restart does not rotate the signature.
# If omitted, a new one is generated for this process and subscriptions are recreated.
# Twitch requires 10–100 characters. A longer value is rejected at startup.
# Generate one using terminal: openssl rand -hex 32
# eventsub_secret = YOUR_RANDOM_EVENTSUB_SECRET_HERE

# Streamers are not listed in this file. They live in DynamoDB
# (table "discord-twitch-streamers", or dynamodb_streamers_table above).
# Add, remove, and list them with the manage_streamer command:
#
#   manage_streamer --list
#   manage_streamer twitch 12345678 "TwitchStreamerName"
#   manage_streamer twitch 12345678 --remove
#
# Twitch IDs are numeric user IDs, not login names.

[youtube]
# Your YouTube Data API v3 Key (from Google Cloud Console)
api_key = YOUR_YOUTUBE_API_KEY_HERE

# How many past videos to check on startup (Defaults to 2)
backfill_check = 2

# Optional. Stable WebSub secret. If omitted, a new one is generated for this
# process and YouTube has to accept the subscription again.
# webhook_secret = YOUR_RANDOM_YOUTUBE_WEBHOOK_SECRET_HERE

# YouTube channels live in the same DynamoDB table as Twitch streamers.
# Channel IDs usually start with "UC".
#
#   manage_streamer youtube UC_x5XG1OV2P6uZZ5FSM9Ttw "GoogleDevelopers"
#   manage_streamer youtube UC_x5XG1OV2P6uZZ5FSM9Ttw --remove
